name: terraform-quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - examples/minimal
          - examples/web-app-with-scopes
          - examples/production-features
          - examples/multiple-pools
          - examples/multi-region-replica
    uses: hatan4ik/terraform-pipelines/.github/workflows/terraform-quality.yml@8fc2a04c7931dd449097bb92b15b085278e3f67a # v0.1.1
    with:
      working_directory: ${{ matrix.directory }}
      check_docs: true

  mrr-contract-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: modules/multi-region-replication
    steps:
      - name: Check out immutable caller revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false

      - name: Initialize without a remote backend
        run: terraform init -backend=false -input=false -no-color

      - name: Run aliased-provider contract tests
        run: terraform test -no-color
